name: Build Tweak & Inject IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct URL to decrypted Telegram IPA (optional if ipa/ folder is used)"
        default: ""
        required: false
        type: string
      upload_method:
        description: "Where to upload the built IPA"
        default: "artifacts"
        required: true
        type: choice
        options:
          - artifacts
          - filebin
          - both

jobs:
  build:
    name: Build & Inject
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'waruhachi/theos'
          theos-branch: 'main'
          sdks-src: 'waruhachi/sdks'
          sdks-branch: 'main'

      - name: Install build & injection tools
        run: |
          brew install make dpkg ldid wget zip unzip
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          python3 -m pip install --upgrade --break-system-packages \
              git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Compile Tweak (.deb rootless)
        run: |
          THEOS_PACKAGE_SCHEME=rootless make clean package FINALPACKAGE=1 STRIP=0
          DEB_PATH=$(find packages -name "*.deb" | head -1)
          [ -n "$DEB_PATH" ] || { echo "::error::deb not produced" >&2; exit 1; }
          echo "DEB_PATH=$DEB_PATH" >> $GITHUB_ENV
          echo "DEB_NAME=$(basename "$DEB_PATH")" >> $GITHUB_ENV

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEB_NAME }}
          path: ${{ env.DEB_PATH }}

      - name: Select target IPA
        id: ipa
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          DEST="${{ github.workspace }}/target.ipa"
          LOCAL_FOUND=""

          # Check ipa/ folder
          if [ -d "ipa" ]; then
            for f in ipa/Telegram.ios ipa/Telegram.ipa ipa/*.ipa ipa/*.ios; do
              if [ -f "$f" ]; then
                LOCAL_FOUND="$f"
                break
              fi
            done
          fi

          # Check root folder
          if [ -z "$LOCAL_FOUND" ]; then
            for f in Telegram.ios Telegram.ipa *.ipa *.ios; do
              if [ -f "$f" ]; then
                LOCAL_FOUND="$f"
                break
              fi
            done
          fi

          if [ -n "$IPA_URL" ]; then
            echo "Downloading IPA from URL..."
            wget "$IPA_URL" --no-verbose -O "$DEST"
          elif [ -n "$LOCAL_FOUND" ]; then
            echo "Using local IPA: $LOCAL_FOUND"
            cp "$LOCAL_FOUND" "$DEST"
          else
            echo "::warning::No ipa_url provided and no IPA found in ipa/Telegram.ios or ipa/*.ipa — skipping IPA injection (only .deb was built)"
            echo "have_ipa=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          file_type=$(file --mime-type -b "$DEST")
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            if head -c 100 "$DEST" | grep -q "git-lfs.github.com"; then
              echo "::error::IPA is a Git LFS pointer. Make sure git lfs is enabled when uploading the file."
            else
              echo "::error::Not a valid IPA file: $file_type"
            fi
            exit 1
          fi

          echo "have_ipa=true" >> "$GITHUB_OUTPUT"

      - name: Strip IPA (Remove PlugIns and AppExtensions for LiveContainer / Sideloading)
        if: ${{ steps.ipa.outputs.have_ipa == 'true' }}
        run: |
          chmod +x Tools/strip-ipa.sh
          Tools/strip-ipa.sh "${{ github.workspace }}/target.ipa"

      - name: Inject Tweak into IPA (Cyan / Pyzule)
        if: ${{ steps.ipa.outputs.have_ipa == 'true' }}
        run: |
          mkdir -p Outputs
          DEB_EXTRACT="$RUNNER_TEMP/deb-extract"
          mkdir -p "$DEB_EXTRACT"
          dpkg-deb -R "$DEB_PATH" "$DEB_EXTRACT"

          DYLIB_SRC=$(find "$DEB_EXTRACT" -name 'Tweak.dylib' | head -1)
          BUNDLE_SRC=$(find "$DEB_EXTRACT" -type d -name 'Tweak.bundle' | head -1)

          TG_VERSION=$(unzip -p "${{ github.workspace }}/target.ipa" 'Payload/*.app/Info.plist' \
              | plutil -extract CFBundleShortVersionString raw - 2>/dev/null || echo "13.1")
          OUT="Outputs/Telegram-Tweak-${TG_VERSION}.ipa"

          INJECT=()
          [ -n "$DYLIB_SRC" ]  && INJECT+=("$DYLIB_SRC")
          [ -n "$BUNDLE_SRC" ] && INJECT+=("$BUNDLE_SRC")

          echo "Injecting: ${INJECT[@]}"
          cyan -i "${{ github.workspace }}/target.ipa" -o "$OUT" \
               -f "${INJECT[@]}" -c 9 -m 15.0 -du

          echo "OUT_IPA=$OUT" >> $GITHUB_ENV

      - name: Verify and ensure clean IPA structure
        if: ${{ steps.ipa.outputs.have_ipa == 'true' }}
        run: |
          cd "$(dirname "$OUT_IPA")"
          rm -rf Payload
          unzip -q "$(basename "$OUT_IPA")"
          find Payload -name '*.appex' -type d -prune -exec rm -rf {} +
          rm -rf Payload/*.app/PlugIns Payload/*.app/Watch Payload/*.app/WatchKit Payload/*.app/com.apple.WatchPlaceholder
          rm -f "$(basename "$OUT_IPA")"
          zip -qry "$(basename "$OUT_IPA")" Payload
          rm -rf Payload
          echo "Final IPA verified and cleaned."

      - name: Upload Telegram-Tweak.ipa artifact
        if: ${{ steps.ipa.outputs.have_ipa == 'true' && (inputs.upload_method == 'artifacts' || inputs.upload_method == 'both' || github.event_name != 'workflow_dispatch') }}
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Tweak-IPA
          path: ${{ env.OUT_IPA }}
          if-no-files-found: error

      - name: Upload IPA to filebin.net
        if: ${{ steps.ipa.outputs.have_ipa == 'true' && (inputs.upload_method == 'filebin' || inputs.upload_method == 'both') }}
        run: |
          BIN="telegram-tweak-${{ github.run_id }}-${{ github.run_attempt }}"
          FILENAME=$(basename "$OUT_IPA")
          curl -fsS -X POST \
               -H "Content-Type: application/octet-stream" \
               --data-binary "@${OUT_IPA}" \
               "https://filebin.net/${BIN}/${FILENAME}" >/dev/null

          DOWNLOAD_URL="https://filebin.net/${BIN}/${FILENAME}"
          echo "Uploaded to: ${DOWNLOAD_URL}"
          {
            echo "### 📦 filebin.net download"
            echo "- **File:** ${FILENAME}"
            echo "- **URL:** ${DOWNLOAD_URL}"
            echo "- _Filebin auto-deletes bins after a period of inactivity — download promptly._"
          } >> "$GITHUB_STEP_SUMMARY"
